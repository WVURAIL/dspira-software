name: Check classroom applications
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/check_flowgraphs.py
      - run: python scripts/render_catalogs.py --check
      - name: Install GNU Radio and receiver block definitions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio-dev gr-osmosdr gr-limesdr cmake g++ python3-yaml python3-h5py python3-matplotlib python3-ephem
      - name: Check observation-processing scripts
        run: |
          /usr/bin/python3 -m compileall -q data-processing
          /usr/bin/python3 tests/data-processing/test_parse_pointing.py
          /usr/bin/python3 tests/data-processing/test_pipeline.py
          for script in az_el_to_galactic convert_to_temperature hdf5_to_csv map_from_csv map_hydrogen_drift plot_total_power; do
            /usr/bin/python3 "data-processing/$script.py" --help > /dev/null
          done
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
      - name: Build, test, and install DSPIRA blocks
        run: |
          cmake -S . -B build -DPYTHON_EXECUTABLE=/usr/bin/python3
          cmake --build build
          ctest --test-dir build --output-on-failure
          sudo cmake --install build
          /usr/bin/python3 -c "from gnuradio import dspira; print(dspira.__file__)"
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
      - name: Generate applications and compatible teaching examples
        run: /usr/bin/python3 scripts/check_generation.py --examples
        env:
          PYTHONNOUSERSITE: "1"
          GRC_BLOCKS_PATH: ${{ github.workspace }}/grc
