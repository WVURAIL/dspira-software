name: Check classroom applications
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/check_flowgraphs.py
      - name: Install GNU Radio and receiver block definitions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio-dev gr-osmosdr gr-limesdr cmake g++ python3-yaml python3-h5py python3-matplotlib python3-ephem
      - name: Check observation-processing scripts
        run: |
          /usr/bin/python3 -m compileall -q data-processing
          /usr/bin/python3 data-processing/test_parse_pointing.py
          for script in az_el2gal convert_to_temperature hdf5_to_csv map_from_csv map_h1_hdf5_drift plot_total_power; do
            /usr/bin/python3 "data-processing/$script.py" --help > /dev/null
          done
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
      - name: Build, test, and install DSPIRA blocks
        run: |
          cmake -S . -B build -DPYTHON_EXECUTABLE=/usr/bin/python3
          cmake --build build
          ctest --test-dir build --output-on-failure
          sudo cmake --install build
          /usr/bin/python3 -c "from gnuradio import dspira; print(dspira.__file__)"
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
      - name: Generate and syntax-check all classroom applications
        run: /usr/bin/python3 scripts/check_generation.py
        env:
          PYTHONNOUSERSITE: "1"
          GRC_BLOCKS_PATH: ${{ github.workspace }}/grc
