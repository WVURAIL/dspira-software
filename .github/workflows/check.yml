name: Check classroom applications
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/check_flowgraphs.py
      - name: Install GNU Radio and receiver block definitions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio gr-osmosdr gr-limesdr python3-yaml
      - uses: actions/checkout@v5
        with:
          repository: WVURAIL/gr-radio_astro
          ref: cdbda4f577b538c0750b882241f8a36ecc2e88f8
          path: shared-blocks
      - name: Generate and syntax-check all classroom applications
        run: /usr/bin/python3 scripts/check_generation.py
        env:
          PYTHONNOUSERSITE: "1"
          GRC_BLOCKS_PATH: ${{ github.workspace }}/shared-blocks/grc
